# Keeps the API awake. Render's free plan sleeps a service after 15 idle
# minutes, and the first request after that waits 20-60 s while it boots.
# Pinging /health every 10 minutes stops it sleeping (one always-on service
# fits in the free plan's 750 hours a month).
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --max-time 120 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://rektopsy-api.onrender.com/health
